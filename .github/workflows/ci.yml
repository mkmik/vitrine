name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv venv /tmp/py
          VIRTUAL_ENV=/tmp/py uv pip install playwright cryptography pyjwt
          /tmp/py/bin/playwright install --with-deps chromium firefox webkit
      - run: e2e/run.sh ${{ matrix.backend }}
        env:
          PYTHON: /tmp/py/bin/python

  image:
    if: github.event_name == 'push'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.9
      - run: ko build --bare --platform=linux/amd64,linux/arm64 --tags=latest,${{ github.sha }} .
